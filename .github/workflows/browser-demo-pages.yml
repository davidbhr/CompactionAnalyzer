name: Publish browser demo to GitHub Pages

# Pushes validate the build; publishing remains manual.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/browser-demo-pages.yml"
      - "webapp/**"
      - "CompactionAnalyzer/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build from the current Python analysis code
        run: python webapp/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: webapp/dist
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
